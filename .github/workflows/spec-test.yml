name: Spec Test

on:
  pull_request:
    paths:
      - 'goclient/**'

jobs:
  spec-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build spec-candidate
        run: go build -o bin/spec-candidate ./goclient/cmd/spec-candidate

      - name: Download latest spec-tester
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --pattern "spec-tester-linux-amd64" --output bin/spec-tester
          chmod +x bin/spec-tester

      - name: Run spec test
        run: bin/spec-tester -- bin/spec-candidate
