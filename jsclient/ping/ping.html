<!doctype html>
<meta charset="utf-8" />
<title>connect browser ping</title>
<pre id="log"></pre>
<script type="module">
  const logEl = document.getElementById("log");
  const params = new URLSearchParams(location.search);
  const serverUrl = required("server");
  const remotePubkey = params.get("remote") || "";
  const reportUrl = params.get("report") || "";
  const dialTimeoutMs = Number(params.get("dialTimeoutMs") || "30000");
  const clientModule = params.get("client") || "/dist/index.js";

  const { ConnectClient } = await import(clientModule);

  let client;
  let pc;

  try {
    client = await ConnectClient.create({
      serverUrl,
      acceptConnection: () => true,
      onIncoming: (incoming) => {
        log("inbound offer authenticated");
        incoming.ondatachannel = ({ channel }) => {
          log(`inbound data channel label=${channel.label}`);
          channel.onmessage = ({ data }) => {
            const text = String(data).trim();
            log(`received ${JSON.stringify(text)}`);
            if (text === "ping") {
              log("sending pong");
              channel.send("pong");
            }
          };
        };
      },
    });

    log(`pubkey=${client.pubkey}`);
    await report("pubkey", client.pubkey);

    if (remotePubkey) {
      const targetKey = await crypto.subtle.importKey(
        "raw",
        base64UrlDecode(remotePubkey),
        "Ed25519",
        true,
        ["verify"],
      );

      log(`dialing ${remotePubkey}`);
      const pingDone = deferred();

      pc = await timeout(
        client.dial(
          targetKey,
          (pc) => {
            const dc = pc.createDataChannel("ping");
            dc.onopen = () => {
              log("data channel open, sending ping");
              dc.send("ping");
            };
            dc.onmessage = ({ data }) => {
              const text = String(data).trim();
              log(`received ${JSON.stringify(text)}`);
              if (text === "pong") {
                pingDone.resolve();
              } else {
                pingDone.reject(new Error(`expected pong, got ${JSON.stringify(text)}`));
              }
            };
          },
        ),
        "dial timeout",
      );

      await timeout(pingDone.promise, "ping/pong timeout");
      log("ping/pong complete, connection succeeded");
      await report("ok", "ping succeeded");
    } else {
      log("listening — share the pubkey above to ping this client");
      await report("listening", client.pubkey);
    }
  } catch (err) {
    await report("fail", err?.stack || String(err));
    throw err;
  } finally {
    if (remotePubkey) pc?.close();
  }

  function required(name) {
    const value = params.get(name);
    if (!value) throw new Error(`missing query param: ${name}`);
    return value;
  }

  function base64UrlDecode(s) {
    const pad = "=".repeat((4 - (s.length % 4)) % 4);
    const b64 = (s + pad).replace(/-/g, "+").replace(/_/g, "/");
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function deferred() {
    let resolve;
    let reject;
    const promise = new Promise((res, rej) => {
      resolve = res;
      reject = rej;
    });
    return { promise, resolve, reject };
  }

  function timeout(promise, message) {
    return Promise.race([
      promise,
      new Promise((_, reject) =>
        setTimeout(() => reject(new Error(message)), dialTimeoutMs),
      ),
    ]);
  }

  function log(message) {
    logEl.textContent += `${new Date().toISOString()} ${message}\n`;
    void report("log", message);
  }

  async function report(status, message) {
    if (!reportUrl) return;
    await fetch(reportUrl, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ status, message }),
    }).catch(() => {});
  }
</script>
