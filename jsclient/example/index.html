<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>WebRTC Relay</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: monospace; max-width: 600px; margin: 2rem auto; padding: 0 1rem; background: #111; color: #ddd; }
  h2, h3 { color: #fff; }
  code { background: #1e1e1e; color: #7ec8e3; padding: 2px 6px; word-break: break-all; display: block; margin: 4px 0; }
  #messages { height: 200px; overflow-y: auto; border: 1px solid #333; background: #1a1a1a; padding: 8px; margin-bottom: 8px; }
  .me   { color: #6699ff; }
  .peer { color: #66cc88; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: 4px; margin-bottom: 4px; background: #1e1e1e; color: #ddd; border: 1px solid #444; }
  button { padding: 4px 12px; background: #2a2a2a; color: #ddd; border: 1px solid #555; cursor: pointer; }
  button:hover { background: #333; }
  #chat { display: none; margin-top: 1rem; }
  #status { margin: 0.5rem 0; color: #888; }
</style>
</head>
<body>
<h2>WebRTC Relay</h2>

<p>Your public key:</p>
<code id="pubkey">connecting…</code>

<h3>Connect to peer</h3>
<form id="connect-form">
  <input id="peer-key" type="text" placeholder="Peer public key" autocomplete="off" required />
  <button type="submit">Connect</button>
</form>

<p id="status">—</p>

<div id="chat">
  <div id="messages"></div>
  <input id="msg-input" type="text" placeholder="Message" />
  <button id="send-btn">Send</button>
</div>

<script type="module" src="./src/main.ts"></script>
</body>
</html>
